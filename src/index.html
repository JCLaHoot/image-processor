<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width">
		<meta name="text-scale" content="scale">
		<title>PNG crunchifier</title>

		<link rel="stylesheet" href="./styles.css">

		<!-- <link rel="icon" type="image/svg+xml" href="https://example.com/favicon.svg"> -->
        


	</head>

	<body>
		<header><nav></nav></header>
		<main id="main">

            <p>This is a tool that takes PNGs, makes them 10x smaller, reduces the colour palette to 4 colours, and compresses the result.</p>
            <!-- <input type="file" id="file-input" accept="image/png" multiple>
            <div id="file-preview">
                    <p>No files currently selected for upload</p>

            </div> -->
        
            <form>
            <div>
                <label for="file-input">Choose images to upload (PNG, JPG)</label>
                <input
                type="file"
                id="file-input"
                name="file-input"
                accept=".jpg, .jpeg, .png"
                multiple />
            </div>
            <div id="file-preview">
                <p>No files currently selected for upload</p>
            </div>
            <div>
                <button type="button" id="file-button">Submit</button>
            </div>
            </form>

            <div id="output">

            </div>


        </main>

		<footer id="footer"></footer>
	</body>

    <!-- <script  src="./script.js"></script> -->
    <script type="module" src="./script.js"></script>

</html>
